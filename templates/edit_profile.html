<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input type="text"
           name="first_name"
           value="{{ user.first_name }}"
           placeholder="Имя">

    <br><br>

    <input type="email"
           name="email"
           value="{{ user.email }}"
           placeholder="Email">

    <br><br>

    <input type="file" name="avatar">

    <br><br>

    <button type="submit">
        Сохранить
    </button>

</form>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="{% static 'main/css/profile.css' %}">
</head>

<body>

<div class="profile-card">

    <h2>Профиль</h2>

    <img src="{{ user.profile.avatar.url }}" class="avatar">

    <p>Имя: {{ user.first_name }}</p>

    <p>Email: {{ user.email }}</p>


    <a href="{% url 'edit_profile' %}">
        <button>Изменить профиль</button>
    </a>


    <br><br>

    <a href="{% url 'logout' %}">
        <button>Выйти</button>
    </a>

    <br><br>

    <a href="/">
        <button>Назад</button>
    </a>

</div>

</body>
</html>

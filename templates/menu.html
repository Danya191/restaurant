{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>

    <link rel="stylesheet" href="{% static 'main/css/menu.css' %}">
</head>

<body>

    <!-- Кнопка назад -->
    <a href="/" class="back-btn">
        ← Главная
    </a>

    <!-- Кнопка корзины -->
    <a href="/shopping_cart/" class="cart-btn">
        🛒 Корзина
    </a>

    <!-- Заголовок -->
    <div class="header">
        <h1>MENU</h1>
    </div>

    <!-- Категории -->
    <div class="categories">

        <a href="?category=all" class="category-btn">
            All
        </a>

        {% for category in categories %}
            <a href="?category={{ category.id }}" class="category-btn">
                {{ category.name }}
            </a>
        {% endfor %}

    </div>

    <!-- Карточки блюд -->
    <div class="menu">

        {% for dish in dishes %}

        <div class="card">

            <!-- Переход на страницу блюда -->
            <a href="{% url 'dish-detail' dish.id %}" class="card-link">

                <img src="{{ dish.image.url }}" alt="{{ dish.name }}">

                <div class="info">

                    <h2>{{ dish.name }}</h2>

                </div>

            </a>

            <div class="bottom">

                <span class="price">
                    {{ dish.price }} ₴
                </span>

                <a href="{% url 'shopping_cart:add_to_cart' dish.id %}">
                    <button class="plus">
                        +
                    </button>
                </a>

            </div>

        </div>

        {% empty %}

        <h2 style="text-align:center; width:100%;">
            Блюд нет
        </h2>

        {% endfor %}

    </div>

</body>
</html>

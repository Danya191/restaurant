{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>

    <link rel="stylesheet" href="{% static 'main/css/home.css' %}">
</head>
<body>










<nav>

    <div class="logo">
        Restaurant
    </div>

    <div class="nav-buttons">

        <a href="{% url 'login' %}">
            <button>{{ t.login }}</button>
        </a>

        <a href="{% url 'register' %}">
            <button>{{ t.register }}</button>
        </a>

        <a href="{% url 'profile' %}">
            <button>{{ t.profile }}</button>
        </a>

        <div class="lang-switcher">
            <a href="/language/ru/">RU</a>
            <a href="/language/uk/">UA</a>
            <a href="/language/en/">EN</a>
        </div>

    </div>

</nav>

<section class="hero">

    <div class="hero-text">

        <h1>
            {{ t.hero_title }}
        </h1>

        <p>
            {{ t.hero_text }}
        </p>

        <a href="/menu/">
            <button class="menu-btn">
                {{ t.menu }}
            </button>
        </a>

    </div>

</section>

<section class="features">

    <div class="feature">
        <h3>{{ t.fast_delivery }}</h3>
    </div>

    <div class="feature">
        <h3>{{ t.fresh_products }}</h3>
    </div>

    <div class="feature">
        <h3>{{ t.best_service }}</h3>
    </div>

</section>

<footer class="footer">
    <p>© 2025 Restaurant</p>
</footer>

</body>
</html>
